networks:
  public:
    name: rabotka-public
  internal:
    name: rabotka-internal

volumes:
  postgres_data:
  redis_data:
  grafana_data:
  qdrant_data:

services:

  traefik:
    image: traefik:v3
    container_name: traefik
    restart: always
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "//var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - public

  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    env_file:
      - .env
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - internal

  redis:
    image: redis:7
    container_name: redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    networks:
      - internal

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    restart: always
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - internal
      - public
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.qdrant.loadbalancer.server.port=6333"

  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: always
    volumes:
      - ./data/grafana:/var/lib/grafana
    networks:
      - internal
      - public
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
