networks:
  public:
    name: hashcode-public
  internal:
    name: hashcode-internal

volumes:
  postgres_data:
  redis_data:
  portainer_data:
  qdrant_data:
  vault_data:


services:

  traefik:
    image: traefik:v3
    container_name: traefik
    restart: always
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--ping=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "//var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hashcode-public"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"

  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    env_file:
      - .env
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - internal

  redis:
    image: redis:7
    container_name: redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    networks:
      - internal

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    restart: always
    environment:
      - POSTGRESQL_HOST=postgres
      - POSTGRESQL_PORT=5432
      - POSTGRESQL_USERNAME=${POSTGRES_USER}
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
      - PGBOUNCER_DATABASE=${PGBOUNCER_DATABASE:-rabotka}
      - PGBOUNCER_POOL_MODE=transaction
      - PGBOUNCER_MAX_CLIENT_CONN=${PGBOUNCER_MAX_CLIENT_CONN:-200}
      - PGBOUNCER_DEFAULT_POOL_SIZE=${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
      - PGBOUNCER_AUTH_TYPE=scram-sha-256
    depends_on:
      - postgres
    networks:
      - internal

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    restart: always
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - internal
      - public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hashcode-public"
      - "traefik.http.services.qdrant.loadbalancer.server.port=6333"


  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - internal
      - public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hashcode-public"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"

  vault:
    image: hashicorp/vault:latest
    container_name: vault
    restart: always
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      - VAULT_ADDR=http://0.0.0.0:8200
      - SKIP_SETCAP=true
    volumes:
      - ./data/vault:/vault/data
      - ./vault/config.hcl:/vault/config/config.hcl
    command: vault server -config=/vault/config/config.hcl
    networks:
      - internal
      - public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hashcode-public"
      - "traefik.http.services.vault.loadbalancer.server.port=8200"
