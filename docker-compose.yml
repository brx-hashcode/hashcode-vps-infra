networks:
  public:
    name: hashcode-public
  internal:
    name: hashcode-internal

volumes:
  postgres_data:
  redis_data:
  portainer_data:
  qdrant_data:
  vault_data:
  prometheus_data:
  grafana_data:


services:

  traefik:
    image: traefik:v3
    container_name: traefik
    restart: always
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--ping=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "//var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hashcode-public"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"

  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    env_file:
      - .env
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - internal

  redis:
    image: redis:7
    container_name: redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    networks:
      - internal

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    restart: always
    environment:
      - POSTGRESQL_HOST=postgres
      - POSTGRESQL_PORT=5432
      - POSTGRESQL_USERNAME=${POSTGRES_USER}
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
      - PGBOUNCER_DATABASE=${PGBOUNCER_DATABASE:-rabotka}
      - PGBOUNCER_POOL_MODE=transaction
      - PGBOUNCER_MAX_CLIENT_CONN=${PGBOUNCER_MAX_CLIENT_CONN:-200}
      - PGBOUNCER_DEFAULT_POOL_SIZE=${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
      - PGBOUNCER_AUTH_TYPE=scram-sha-256
    depends_on:
      - postgres
    networks:
      - internal

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    restart: always
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - internal


  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - internal
      - public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hashcode-public"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: always
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - internal

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    networks:
      - internal
      - public

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.${INFRA_DOMAIN}
      - GF_ALERTING_ENABLED=true
      - GF_UNIFIED_ALERTING_ENABLED=true
      - VPS_SLACK_ALERT_WEBHOOK=${VPS_SLACK_ALERT_WEBHOOK}
      - GF_AUTH_GITHUB_ROLE_ATTRIBUTE_PATH='Admin'
      - GF_AUTH_GITHUB_SKIP_ORG_ROLE_SYNC=false
      - GF_AUTH_GITHUB_ENABLED=true
      - GF_AUTH_GITHUB_CLIENT_ID=${GF_GITHUB_CLIENT_ID}
      - GF_AUTH_GITHUB_CLIENT_SECRET=${GF_GITHUB_CLIENT_SECRET}
      - GF_AUTH_GITHUB_ALLOWED_ORGANIZATIONS=brx-hashcode
      - GF_AUTH_GITHUB_ALLOW_SIGN_UP=true
      - GF_AUTH_GITHUB_SCOPES=user:email,read:org
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - internal
      - public

  vault:
    image: hashicorp/vault:latest
    container_name: vault
    restart: always
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      - VAULT_ADDR=http://0.0.0.0:8200
      - SKIP_SETCAP=true
    volumes:
      - ./data/vault:/vault/data
      - ./vault/config.hcl:/vault/config/config.hcl
    command: vault server -config=/vault/config/config.hcl
    networks:
      - internal
      - public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hashcode-public"
      - "traefik.http.services.vault.loadbalancer.server.port=8200"
