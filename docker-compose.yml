networks:
  public:
    name: hashcode-public
  internal:
    name: hashcode-internal

volumes:
  postgres_data:
  redis_data:
  portainer_data:
  qdrant_data:
  vault_data:
  prometheus_data:
  grafana_data:


services:

  traefik:
    # Pinned, like Portainer was after `:latest` bit us (see its comment below).
    #
    # `traefik:v3` is a floating tag: every `docker compose pull` in the deploy
    # could move the running version without a single line changing in this
    # repo. The box was on 3.7.11 with nobody having decided that. When all
    # fourteen certificates were found expired on 2026-08-22, "did Traefik
    # change under us?" was a question the repository could not answer — and an
    # unanswerable question during an incident is its own cost.
    #
    # Bump deliberately, read the release notes for ACME changes when you do.
    image: traefik:v3.7.11
    container_name: traefik
    restart: always
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--ping=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "//var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hashcode-public"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"

  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    env_file:
      - .env
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - internal

  redis:
    image: redis:7
    container_name: redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    networks:
      - internal

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    restart: always
    environment:
      - POSTGRESQL_HOST=postgres
      - POSTGRESQL_PORT=5432
      - POSTGRESQL_USERNAME=${POSTGRES_USER}
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
      - PGBOUNCER_DATABASE=${PGBOUNCER_DATABASE:-rabotka}
      - PGBOUNCER_POOL_MODE=transaction
      - PGBOUNCER_MAX_CLIENT_CONN=${PGBOUNCER_MAX_CLIENT_CONN:-200}
      - PGBOUNCER_DEFAULT_POOL_SIZE=${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
      - PGBOUNCER_AUTH_TYPE=scram-sha-256
    depends_on:
      - postgres
    networks:
      - internal

  # Reachable ONLY from the internal network. Not published, not routed.
  #
  # On 2026-08-22 this was on the `public` network with a Traefik router and
  # NO api key, so `curl https://qdrant.hashcode.digital/collections` from
  # anywhere on the internet listed every collection — including
  # rabotka_prod_workers, rabotka_prod_employers and rabotka_prod_user_interests
  # — and the same open door accepted writes and DELETEs.
  #
  # Qdrant enforces nothing unless QDRANT__SERVICE__API_KEY is set. The backend
  # had been sending QDRANT_API_KEY all along; the server simply never checked
  # it, so the key gave a false sense of being closed.
  #
  # Two locks now, because either alone is one mistake away from the same
  # outcome: the key means a leaked network position is not enough, and the
  # missing route means a leaked key is not enough.
  #
  # For the dashboard, tunnel instead of publishing:
  #   ssh -L 6333:localhost:6333 <user>@<vps>   → http://localhost:6333/dashboard
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    restart: always
    environment:
      # Server-side enforcement. Must match QDRANT_API_KEY in the backend's
      # Vault entry, which is the value its client already sends.
      - "QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}"
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - internal


  portainer:
    # Business Edition, not Community — and that is not a typo.
    #
    # Someone activated the free Business licence from inside the Portainer UI.
    # Portainer's in-app updater recreated its own container on the `-ee` image
    # and flagged `portainer_data` as a BE database, entirely outside compose.
    # This file went on claiming `-ce`, and nothing recreated the container for
    # long enough that the lie stayed invisible — until the next `up -d`, when
    # the CE binary refused to open a BE database and crash-looped:
    #
    #   FTL the Portainer database is set for Portainer Business Edition
    #
    # So this line records what is actually running. Do NOT "fix" it back to
    # `-ce`: that reproduces the outage. Moving to CE is possible, but it takes
    # a deliberate `--rollback-to-ce` on the volume first, and it reverts the
    # configuration to how it was when BE was activated.
    #
    # Pinned rather than :latest because Portainer migrates its data volume on
    # upgrade and will not start on an older image afterwards, so the version
    # has to be a decision rather than whatever a deploy happens to pull.
    # 2.39.8 is on the 2.39 LTS line. 2.45 is also LTS now, but moving to it is
    # a separate, one-way data migration — do it deliberately, not in passing.
    #
    # Built locally rather than pulled: portainer/Dockerfile strips a dead
    # googlecode.com <script> that made Chrome flag the host as dangerous.
    # `pull_policy: build` keeps the deploy's `compose pull` from looking for
    # this tag in a registry. Bump the version in PORTAINER_VERSION and the tag.
    build:
      context: ./portainer
      args:
        PORTAINER_VERSION: 2.39.8
    image: hashcode/portainer-ee:2.39.8-noshim
    pull_policy: build
    container_name: portainer
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - internal
      - public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hashcode-public"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: always
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - internal

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    networks:
      - internal
      - public

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.${INFRA_DOMAIN}
      - GF_ALERTING_ENABLED=true
      - GF_UNIFIED_ALERTING_ENABLED=true
      - VPS_SLACK_ALERT_WEBHOOK=${VPS_SLACK_ALERT_WEBHOOK}
      - GF_AUTH_GITHUB_ROLE_ATTRIBUTE_PATH='Admin'
      - GF_AUTH_GITHUB_SKIP_ORG_ROLE_SYNC=false
      - GF_AUTH_GITHUB_ENABLED=true
      - GF_AUTH_GITHUB_CLIENT_ID=${GF_GITHUB_CLIENT_ID}
      - GF_AUTH_GITHUB_CLIENT_SECRET=${GF_GITHUB_CLIENT_SECRET}
      - GF_AUTH_GITHUB_ALLOWED_ORGANIZATIONS=brx-hashcode
      - GF_AUTH_GITHUB_ALLOW_SIGN_UP=true
      - GF_AUTH_GITHUB_SCOPES=user:email,read:org
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - internal
      - public

  vault:
    image: hashicorp/vault:latest
    container_name: vault
    restart: always
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      - VAULT_ADDR=http://0.0.0.0:8200
      - SKIP_SETCAP=true
    volumes:
      - ./data/vault:/vault/data
      - ./vault/config.hcl:/vault/config/config.hcl
    command: vault server -config=/vault/config/config.hcl
    networks:
      - internal
      - public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hashcode-public"
      - "traefik.http.services.vault.loadbalancer.server.port=8200"
