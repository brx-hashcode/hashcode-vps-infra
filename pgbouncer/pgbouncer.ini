[databases]
; Add one entry per environment database.
; Client connects to: postgresql://USER:PASS@pgbouncer:5432/<name>
rabotka_dev  = host=postgres port=5432 dbname=rabotka_dev
rabotka_prod = host=postgres port=5432 dbname=rabotka_prod

[pgbouncer]
listen_addr       = 0.0.0.0
listen_port       = 5432
auth_type         = plain
auth_file         = /etc/pgbouncer/userlist.txt
pool_mode         = transaction
max_client_conn   = 200
default_pool_size = 20
log_connections   = 0
log_disconnections = 0
server_tls_sslmode = disable
