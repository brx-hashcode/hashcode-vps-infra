apiVersion: 1

contactPoints:
  - orgId: 1
    name: slack-alerts
    receivers:
      - uid: slack-alerts
        type: slack
        settings:
          url: "${VPS_SLACK_ALERT_WEBHOOK}"
          title: "🚨 Grafana Alert — {{ .CommonLabels.alertname }}"
          text: "{{ range .Alerts }}*{{ .Annotations.summary }}*\n{{ .Annotations.description }}\n{{ end }}"
