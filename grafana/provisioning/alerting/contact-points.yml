apiVersion: 1

contactPoints:
  - orgId: 1
    name: slack-alerts
    receivers:
      - uid: slack-alerts
        type: slack
        settings:
          url: "${VPS_SLACK_ALERT_WEBHOOK}"
          title: "{{ if eq .Status \"firing\" }}{{ if eq .CommonLabels.severity \"critical\" }}🔴{{ else }}🟠{{ end }}{{ else }}✅ RESOLVED {{ end }}{{ .CommonLabels.alertname }}"
          text: "{{ range .Alerts }}*Status:* {{ $.Status | toUpper }}{{ if .Labels.severity }} ({{ .Labels.severity }}){{ end }}\n*Summary:* {{ .Annotations.summary }}\n{{ if .Annotations.description }}*Description:* {{ .Annotations.description }}\n{{ end }}*Started:* {{ .StartsAt.Format \"2006-01-02 15:04:05 UTC\" }}\n*Dashboard:* https://grafana.hashcode.digital\n{{ end }}"
