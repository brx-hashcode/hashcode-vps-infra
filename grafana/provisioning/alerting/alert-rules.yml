apiVersion: 1

groups:
  - orgId: 1
    name: vps-alerts
    folder: Alerts
    interval: 1m
    rules:
      # ── CPU ──────────────────────────────────────────────────────────────
      - uid: cpu-high
        title: CPU High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 100 - (avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [90], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
                  type: query
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Alerting
        for: 10m
        annotations:
          summary: "CPU above 90% for 10m on {{ $labels.instance }}"
          description: "CPU usage is {{ printf \"%.1f\" $values.A.Value }}% (warning threshold 90%) on {{ $labels.instance }}. Check `docker stats` / `top` for a runaway process. If sustained, consider capping container CPU or scaling the VPS."
        labels:
          severity: warning

      - uid: cpu-critical
        title: CPU Critical
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 100 - (avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [95], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
                  type: query
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "CPU above 95% for 5m on {{ $labels.instance }}"
          description: "CPU usage is {{ printf \"%.1f\" $values.A.Value }}% (critical threshold 95%) on {{ $labels.instance }}. The host is saturated — investigate immediately (`docker stats`, `top`)."
        labels:
          severity: critical

      # ── RAM ──────────────────────────────────────────────────────────────
      - uid: ram-high
        title: RAM High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [90], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
                  type: query
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Alerting
        for: 10m
        annotations:
          summary: "RAM above 90% for 10m on {{ $labels.instance }}"
          description: "Memory usage is {{ printf \"%.1f\" $values.A.Value }}% (warning threshold 90%) on {{ $labels.instance }}. Note: Linux counts cache as used — check `free -h` (available, not used). If genuinely high, restart heavy containers or add swap/RAM."
        labels:
          severity: warning

      - uid: ram-critical
        title: RAM Critical
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [95], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
                  type: query
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "RAM above 95% for 5m on {{ $labels.instance }}"
          description: "Memory usage is {{ printf \"%.1f\" $values.A.Value }}% (critical threshold 95%) on {{ $labels.instance }}. OOM-kill risk — free memory now (`docker stats` to find the offender) or add swap/RAM."
        labels:
          severity: critical

      # ── Disk ─────────────────────────────────────────────────────────────
      - uid: disk-high
        title: Disk Full
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [90], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
                  type: query
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "Disk above 90% on {{ $labels.instance }}"
          description: "Root disk is {{ printf \"%.1f\" $values.A.Value }}% full on {{ $labels.instance }}. Clean up Docker (`docker system prune`), logs, or old data before it fills completely."
        labels:
          severity: critical
