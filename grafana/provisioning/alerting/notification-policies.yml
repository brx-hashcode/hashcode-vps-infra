apiVersion: 1

policies:
  - orgId: 1
    receiver: slack-alerts
    group_by: [alertname, severity]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # Critical alerts re-notify more often until resolved.
      - receiver: slack-alerts
        matchers:
          - severity = critical
        group_by: [alertname, severity]
        group_wait: 10s
        group_interval: 5m
        repeat_interval: 1h
