# Mailcow override — connects nginx-mailcow to Traefik via hashcode-public network.
# Copy this file to /opt/mailcow/ as docker-compose.override.yml alongside the upstream docker-compose.yml.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.override.yml up -d

services:
  nginx-mailcow:
    networks:
      hashcode-public:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hashcode-public"
      - "traefik.http.routers.mailcow.rule=Host(`mail.hashcode.digital`)"
      - "traefik.http.routers.mailcow.entrypoints=websecure"
      - "traefik.http.routers.mailcow.tls.certresolver=letsencrypt"
      - "traefik.http.services.mailcow.loadbalancer.server.port=80"

networks:
  hashcode-public:
    external: true
