name: Deploy Infra

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    name: Validate Compose files
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Create dummy .env for validation
        run: |
          cat > .env <<EOF
          INFRA_DOMAIN=hashcode.org
          EMAIL=ci@hashcode.org
          POSTGRES_USER=ci
          POSTGRES_PASSWORD=ci
          REDIS_PASSWORD=ci
          GRAFANA_ADMIN_USER=ci
          GRAFANA_ADMIN_PASSWORD=ci
          TRAEFIK_DASHBOARD_AUTH=ci
          EOF

      - name: Validate base compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate production overlay
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: INFRA_DOMAIN,EMAIL,POSTGRES_USER,POSTGRES_PASSWORD,REDIS_PASSWORD,GRAFANA_ADMIN_USER,GRAFANA_ADMIN_PASSWORD
          script: |
            set -e

            # Move into the repo (so compose paths work).
            cd ~/hashcode-infra
            git pull origin develop

            # Write .env from GitHub Secrets (passed as environment variables).
            cat > .env <<EOF
            INFRA_DOMAIN=${INFRA_DOMAIN}
            EMAIL=${EMAIL}

            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

            REDIS_PASSWORD=${REDIS_PASSWORD}

            GRAFANA_ADMIN_USER=${GRAFANA_ADMIN_USER}
            GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
            EOF
            chmod 600 .env

            # Ensure bootstrap has run (idempotent)
            mkdir -p data/postgres data/redis data/qdrant data/grafana data/vault data/prometheus traefik
            if [ ! -f traefik/acme.json ]; then
              touch traefik/acme.json
              chmod 600 traefik/acme.json
            fi

            # Deploy with production overlay
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
        env:
          INFRA_DOMAIN: ${{ secrets.INFRA_DOMAIN }}
          EMAIL: ${{ secrets.EMAIL }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}

  smoke-test:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read

    steps:
      - name: Wait for services to stabilize
        run: sleep 20

      - name: Check Traefik dashboard
        run: |
          curl -sf --max-time 10 \
            -u "${{ secrets.TRAEFIK_DASHBOARD_AUTH_PLAIN }}" \
            "https://traefik.${{ secrets.INFRA_DOMAIN }}/api/rawdata" > /dev/null

      - name: Check Grafana
        run: |
          curl -sf --max-time 10 \
            "https://grafana.${{ secrets.INFRA_DOMAIN }}/api/health" | grep -q '"database": "ok"'

      - name: Check Qdrant
        run: |
          curl -sf --max-time 10 \
            "https://qdrant.${{ secrets.INFRA_DOMAIN }}/" | grep -q '"status": "ok"'

      - name: Check Vault
        run: |
          curl -sf --max-time 10 \
            "https://vault.${{ secrets.INFRA_DOMAIN }}/v1/sys/health" | grep -q '"initialized"'
