name: Deploy Infra

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: INFRA_DOMAIN,EMAIL,POSTGRES_USER,POSTGRES_PASSWORD,REDIS_PASSWORD,GRAFANA_ADMIN_USER,GRAFANA_ADMIN_PASSWORD
          script: |
            set -e

            # Move into the repo (so compose paths work).
            cd ~/hashcode-infra
            git pull origin main

            # Write .env from GitHub Secrets (passed as environment variables).
            cat > .env <<EOF
            INFRA_DOMAIN=${INFRA_DOMAIN}
            EMAIL=${EMAIL}

            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

            REDIS_PASSWORD=${REDIS_PASSWORD}

            GRAFANA_ADMIN_USER=${GRAFANA_ADMIN_USER}
            GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
            EOF
            chmod 600 .env

            # Ensure bootstrap has run (idempotent)
            mkdir -p data/postgres data/redis data/qdrant data/grafana data/vault data/sonarqube/data data/sonarqube/logs data/sonarqube/extensions traefik
            if [ ! -f traefik/acme.json ]; then
              touch traefik/acme.json
              chmod 600 traefik/acme.json
            fi

            # Deploy with production overlay
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
        env:
          INFRA_DOMAIN: ${{ secrets.INFRA_DOMAIN }}
          EMAIL: ${{ secrets.EMAIL }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
