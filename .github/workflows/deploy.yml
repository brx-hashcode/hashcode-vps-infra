name: Deploy Infra

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    name: Validate Compose files
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Create dummy .env for validation
        run: |
          cat > .env <<EOF
          INFRA_DOMAIN=hashcode.digital
          EMAIL=ci@hashcode.digital
          POSTGRES_USER=ci
          POSTGRES_PASSWORD=ci
          REDIS_PASSWORD=ci
          QDRANT_API_KEY=ci
          TRAEFIK_DASHBOARD_AUTH=ci
          VPS_SLACK_ALERT_WEBHOOK=ci
          EOF

      - name: Validate base compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate production overlay
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          # Two lists, and BOTH must name a variable for it to arrive.
          #
          # `env:` below puts it in the runner's environment; this `envs:` is
          # what appleboy/ssh-action actually forwards into the remote shell.
          # A variable present in one and absent from the other reaches the VPS
          # as an EMPTY STRING — no error, no warning. That is how the first
          # DNS-01 deploy wrote `CF_DNS_API_TOKEN=` into .env and Traefik came
          # up reporting missing Cloudflare credentials.
          envs: INFRA_DOMAIN,EMAIL,CF_DNS_API_TOKEN,QDRANT_API_KEY,POSTGRES_USER,POSTGRES_PASSWORD,REDIS_PASSWORD,TRAEFIK_DASHBOARD_AUTH,GRAFANA_PASSWORD,VPS_SLACK_ALERT_WEBHOOK,GF_GITHUB_CLIENT_ID,GF_GITHUB_CLIENT_SECRET,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY,R2_ACCOUNT_ID
          script: |
            set -e

            # Move into the repo (so compose paths work).
            cd ~/hashcode-vps-infra

            # `fetch` + `reset --hard`, never `git pull`.
            #
            # This checkout is a deployment artifact, not a workspace: it has to
            # end up identical to origin/develop whatever state it drifted into.
            # `git pull` merges, and a merge can conflict — which is what took
            # the deploy down on 2026-08-20, when a divergent local history on
            # the box produced add/add conflicts across ten files. `set -e` then
            # aborted the script before a single container was touched, and the
            # deploy could not run again until someone SSH'd in by hand.
            #
            # `reset --hard` cannot conflict, and it is idempotent, so a rerun is
            # always safe. It only rewrites TRACKED files: .env, traefik/acme.json
            # and the bind-mounted data/ directories — Postgres, Redis, Qdrant and
            # Vault — are untracked and are left untouched.
            #
            # Deliberately no `git clean`: it would delete precisely those.
            git fetch origin develop
            git reset --hard FETCH_HEAD

            # Write .env from GitHub Secrets (passed as environment variables).
            # COMPOSE_FILE first: a bare `docker compose ...` on this box must
            # never run the base file alone — that Traefik has no websecure
            # entrypoint and no certificate resolver, and every site goes down.
            printf '%s\n' \
              "COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml" \
              "INFRA_DOMAIN=hashcode.digital" \
              "EMAIL=${EMAIL}" \
              "CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}" \
              "QDRANT_API_KEY=${QDRANT_API_KEY}" \
              "POSTGRES_USER=${POSTGRES_USER}" \
              "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" \
              "REDIS_PASSWORD=${REDIS_PASSWORD}" \
              "GRAFANA_PASSWORD=${GRAFANA_PASSWORD}" \
              "GF_GITHUB_CLIENT_ID=${GF_GITHUB_CLIENT_ID}" \
              "GF_GITHUB_CLIENT_SECRET=${GF_GITHUB_CLIENT_SECRET}" \
              "VPS_SLACK_ALERT_WEBHOOK=${VPS_SLACK_ALERT_WEBHOOK}" \
              "TRAEFIK_DASHBOARD_AUTH=$(echo "${TRAEFIK_DASHBOARD_AUTH}" | sed 's/\$/\$\$/g')" \
              "R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}" \
              "R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}" \
              "R2_ACCOUNT_ID=${R2_ACCOUNT_ID}" \
              > .env
            chmod 600 .env

            # Fail loudly rather than bring up a Traefik that cannot renew
            # anything. The first DNS-01 deploy wrote `CF_DNS_API_TOKEN=` here
            # — the secret existed, but was missing from the action's `envs:`
            # list — and everything reported success. The certificates would
            # simply have expired again in ninety days.
            #
            # A deployment that cannot obtain certificates is a failed
            # deployment, and should say so at the point the value is written,
            # not in a container log nobody reads.
            if ! grep -q '^CF_DNS_API_TOKEN=..*' .env; then
              echo "FATAL: CF_DNS_API_TOKEN is empty in .env — Traefik cannot"
              echo "       run the ACME DNS-01 challenge and no certificate"
              echo "       will ever renew."
              echo "  Check: the repository secret exists, AND CF_DNS_API_TOKEN"
              echo "         is listed in this step's \`envs:\` input."
              exit 1
            fi

            # Same shape, same reason. Qdrant enforces NOTHING when its api key
            # is empty — it does not warn, it simply serves every request it
            # receives. That is how the production vector store ended up
            # readable, writable and deletable from the internet.
            if ! grep -q '^QDRANT_API_KEY=..*' .env; then
              echo "FATAL: QDRANT_API_KEY is empty in .env — Qdrant would start"
              echo "       with authentication DISABLED."
              echo "  It must match the value the backend reads from Vault."
              exit 1
            fi

            # Ensure bootstrap has run (idempotent)
            mkdir -p data/postgres data/redis data/qdrant data/vault traefik data/prometheus data/grafana
            if [ ! -f traefik/acme.json ]; then
              touch traefik/acme.json
              chmod 600 traefik/acme.json
            fi

            # Deploy with production overlay
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
        env:
          INFRA_DOMAIN: ${{ secrets.INFRA_DOMAIN }}
          EMAIL: ${{ secrets.EMAIL }}
          # Cloudflare token for the ACME DNS-01 challenge. Scoped to
          # Zone:DNS:Edit on the rabotka/hashcode zones — never the Global API
          # Key, which can do anything to the account.
          CF_DNS_API_TOKEN: ${{ secrets.CF_DNS_API_TOKEN }}
          # Qdrant's SERVER-side key. Must equal the QDRANT_API_KEY the backend
          # reads from Vault, which is the value its client already sends —
          # otherwise every backend query starts returning 401.
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
          GF_GITHUB_CLIENT_ID: ${{ secrets.GF_GITHUB_CLIENT_ID }}
          GF_GITHUB_CLIENT_SECRET: ${{ secrets.GF_GITHUB_CLIENT_SECRET }}
          VPS_SLACK_ALERT_WEBHOOK: ${{ secrets.VPS_SLACK_ALERT_WEBHOOK }}
          TRAEFIK_DASHBOARD_AUTH: ${{ secrets.TRAEFIK_DASHBOARD_AUTH }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}

  smoke-test:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Wait for services to stabilize
        run: sleep 20

      - name: Check Traefik
        continue-on-error: true
        run: |
          curl -sf --max-time 10 \
            "https://traefik.${{ secrets.INFRA_DOMAIN }}/ping" > /dev/null

      - name: Check Portainer
        continue-on-error: true
        run: |
          curl -sf --max-time 10 \
            "https://portainer.${{ secrets.INFRA_DOMAIN }}/api/system/status" > /dev/null

      - name: Check Qdrant
        continue-on-error: true
        run: |
          curl -sf --max-time 10 \
            "https://qdrant.${{ secrets.INFRA_DOMAIN }}/healthz" | grep -q 'healthz check passed'

      - name: Check Vault
        continue-on-error: true
        run: |
          curl -s --max-time 10 \
            "https://vault.${{ secrets.INFRA_DOMAIN }}/v1/sys/health" | grep -q '"initialized"'

      - name: Check Grafana
        continue-on-error: true
        run: |
          curl -sf --max-time 10 \
            "https://grafana.${{ secrets.INFRA_DOMAIN }}/api/health" | grep -q '"ok"'

      - name: Check Prometheus
        continue-on-error: true
        run: |
          curl -s --max-time 10 \
            "https://prometheus.${{ secrets.INFRA_DOMAIN }}/-/healthy" | grep -q 'Healthy\|401'

      - name: Slack notify success
        if: success()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#00B32C",
                  "text": "Deploy Succeeded\nBranch: `${{ github.ref_name }}`\nAuthor: ${{ github.actor }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }
              ]
            }

      - name: Slack notify failure
        if: failure()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#B3000C",
                  "text": "Deploy Failed\nBranch: `${{ github.ref_name }}`\nAuthor: ${{ github.actor }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }
              ]
            }
