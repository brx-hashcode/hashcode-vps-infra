name: Deploy Infra

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    name: Validate Compose files
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Create dummy .env for validation
        run: |
          cat > .env <<EOF
          INFRA_DOMAIN=hashcode.digital
          EMAIL=ci@hashcode.digital
          POSTGRES_USER=ci
          POSTGRES_PASSWORD=ci
          REDIS_PASSWORD=ci
          TRAEFIK_DASHBOARD_AUTH=ci
          EOF

      - name: Validate base compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate production overlay
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: INFRA_DOMAIN,EMAIL,POSTGRES_USER,POSTGRES_PASSWORD,REDIS_PASSWORD
          script: |
            set -e

            # Move into the repo (so compose paths work).
            cd ~/hashcode-vps-infra
            git pull origin develop

            # Write .env from GitHub Secrets (passed as environment variables).
            cat > .env <<EOF
            INFRA_DOMAIN=hashcode.digital
            EMAIL=${EMAIL}

            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

            REDIS_PASSWORD=${REDIS_PASSWORD}
            EOF
            chmod 600 .env

            # Ensure bootstrap has run (idempotent)
            mkdir -p data/postgres data/redis data/qdrant data/vault traefik
            if [ ! -f traefik/acme.json ]; then
              touch traefik/acme.json
              chmod 600 traefik/acme.json
            fi

            # Deploy with production overlay
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

            # Deploy Mailcow override (if Mailcow is set up)
            if [ -d /opt/mailcow ]; then
              echo "==> Updating Mailcow override..."
              cp ~/hashcode-vps-infra/mailcow/docker-compose.override.yml /opt/mailcow/docker-compose.override.yml
              cd /opt/mailcow
              docker compose -f docker-compose.yml -f docker-compose.override.yml up -d --remove-orphans
              cd ~/hashcode-vps-infra
            fi
        env:
          INFRA_DOMAIN: ${{ secrets.INFRA_DOMAIN }}
          EMAIL: ${{ secrets.EMAIL }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}

  smoke-test:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read

    steps:
      - name: Wait for services to stabilize
        run: sleep 20

      - name: Check Traefik dashboard
        run: |
          curl -sf --max-time 10 \
            -u "${{ secrets.TRAEFIK_DASHBOARD_AUTH_PLAIN }}" \
            "https://traefik.${{ secrets.INFRA_DOMAIN }}/api/rawdata" > /dev/null

      - name: Check Portainer
        run: |
          curl -sf --max-time 10 \
            "https://portainer.${{ secrets.INFRA_DOMAIN }}/api/system/status" | grep -q '"platform"'

      - name: Check Qdrant
        run: |
          curl -sf --max-time 10 \
            "https://qdrant.${{ secrets.INFRA_DOMAIN }}/" | grep -q '"status": "ok"'

      - name: Check Vault
        run: |
          curl -sf --max-time 10 \
            "https://vault.${{ secrets.INFRA_DOMAIN }}/v1/sys/health" | grep -q '"initialized"'

      - name: Check Mailcow (if deployed)
        continue-on-error: true
        run: |
          curl -sf --max-time 10 \
            "https://mail.hashcode.digital/" > /dev/null
