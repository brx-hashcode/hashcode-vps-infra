name: Deploy Infra

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get GitHub OIDC token (for Vault)
        id: oidc
        env:
          AUDIENCE: vault
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -sS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")"
          TOKEN="$(python -c 'import json,sys; print(json.loads(sys.stdin.read())["value"])' <<<"$OIDC_JSON")"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            # Move into the repo (so compose paths work).
            cd ~/hashcode-infra
            git pull origin main

            # Start Vault first (so we can read secrets and render the VPS .env).
            docker compose -f docker-compose.yml up -d vault

            # Render .env from Vault (GitHub Actions JWT -> KV)
            GITHUB_JWT='${{ steps.oidc.outputs.token }}' \
            bash ./scripts/render-infra-env-from-vault.sh prod .env

            # Ensure bootstrap has run (idempotent)
            mkdir -p data/postgres data/redis data/qdrant data/grafana data/vault traefik
            if [ ! -f traefik/acme.json ]; then
              touch traefik/acme.json
              chmod 600 traefik/acme.json
            fi

            # Deploy with production overlay
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
