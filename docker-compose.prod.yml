# Production overlay — adds TLS, HTTPS redirect, and Let's Encrypt.
#
# Usage on VPS:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:

  traefik:
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme.json"
      # DNS-01, not HTTP-01 — and this is the fix for the 2026-08-22 outage in
      # which all fourteen certificates expired.
      #
      # Every domain here is PROXIED THROUGH CLOUDFLARE. Let's Encrypt therefore
      # never reached this box: it resolved the names to Cloudflare's edge
      # (2606:4700::/32 in the logs) and got Cloudflare's answer to the
      # challenge, not Traefik's. The evidence, straight from the failures:
      #
      #   qdrant / vault / portainer / api.rabotka.work → 404
      #   traefik / prometheus                          → 401 (their basicauth)
      #   rabotka.work / admin.rabotka.work             → the SPA's index.html
      #   www.rabotka.work                              → followed a redirect to
      #                                                   https://rabotka.work
      #
      # The `web` entrypoint carries a global HTTP→HTTPS redirect and Cloudflare
      # adds its own, so the challenge always ended up on :443, where no ACME
      # router exists — the request fell through to the application.
      #
      # TLS-ALPN-01 would NOT have helped: Cloudflare terminates TLS, so an
      # ALPN challenge cannot reach the origin either. Any challenge that
      # depends on an inbound connection is defeated by a proxy. DNS-01 answers
      # in the zone instead, so the proxy is irrelevant — and it is the only
      # method that could also issue wildcards later.
      #
      # CF_DNS_API_TOKEN is a scoped Cloudflare token (Zone:DNS:Edit on these
      # zones only). Never the Global API Key: that one can do anything to the
      # account, and it would sit in this container's environment.
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
      # Resolve against public resolvers rather than the host's. The check is
      # for propagation of OUR TXT record, and a resolver that caches the
      # negative answer stalls every issuance behind its own TTL.
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--api.dashboard=true"
      - "--ping=true"
      - "--ping.entrypoint=websecure"
      # Metrics, and the reason they exist: on 2026-08-22 all fourteen
      # certificates were found expired, some for over two weeks — including
      # api.rabotka.work. Nothing had reported it. Prometheus and Grafana were
      # already running on this box; Traefik simply was not exposing anything
      # for them to scrape, so the one signal that mattered did not exist.
      #
      # `traefik_tls_certs_not_after` is the gauge that closes that gap; the
      # alert rule lives in grafana/provisioning/alerting/alert-rules.yml.
      #
      # The metrics entrypoint is deliberately NOT routed through a Traefik
      # router: it is reachable on the internal Docker network by Prometheus
      # and nowhere else, because it would otherwise publish the full traffic
      # profile of every service to anyone who found the URL.
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=metrics"
      - "--entrypoints.metrics.address=:8082"
    environment:
      # Read by lego (Traefik's ACME library) for the DNS-01 challenge above.
      #
      # BOTH variables, deliberately, and both holding the SAME token. lego
      # splits the work in two — one credential to resolve a domain to its Zone
      # ID, another to write the TXT record — and refuses to start if either is
      # missing:
      #
      #   cannot get ACME client cloudflare: some credentials information are
      #   missing: CLOUDFLARE_DNS_API_TOKEN,CLOUDFLARE_ZONE_API_TOKEN
      #
      # Setting only CF_DNS_API_TOKEN is not enough, however broad that token
      # is. The single token here carries Zone:Read AND DNS:Edit, which is what
      # makes one value valid for both roles.
      - "CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}"
      - "CF_ZONE_API_TOKEN=${CF_DNS_API_TOKEN}"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/acme.json:/acme.json"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hashcode-public"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${INFRA_DOMAIN}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=traefik-auth"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"

  qdrant:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hashcode-public"
      - "traefik.http.routers.qdrant.rule=Host(`qdrant.${INFRA_DOMAIN}`)"
      - "traefik.http.routers.qdrant.entrypoints=websecure"
      - "traefik.http.routers.qdrant.tls.certresolver=letsencrypt"
      - "traefik.http.services.qdrant.loadbalancer.server.port=6333"

  portainer:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hashcode-public"
      - "traefik.http.routers.portainer.rule=Host(`portainer.${INFRA_DOMAIN}`)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.routers.portainer.tls.certresolver=letsencrypt"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"

  vault:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hashcode-public"
      - "traefik.http.routers.vault.rule=Host(`vault.${INFRA_DOMAIN}`)"
      - "traefik.http.routers.vault.entrypoints=websecure"
      - "traefik.http.routers.vault.tls.certresolver=letsencrypt"
      - "traefik.http.services.vault.loadbalancer.server.port=8200"

  grafana:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hashcode-public"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${INFRA_DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  prometheus:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hashcode-public"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.${INFRA_DOMAIN}`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
      - "traefik.http.routers.prometheus.middlewares=traefik-auth"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
