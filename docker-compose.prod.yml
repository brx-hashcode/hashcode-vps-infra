# Production overlay — adds TLS, HTTPS redirect, and Let's Encrypt.
#
# Usage on VPS:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:

  traefik:
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--api.dashboard=true"
      - "--ping=true"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/acme.json:/acme.json"
      - "./traefik/logs:/var/log/traefik"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hashcode-public"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${INFRA_DOMAIN}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=traefik-auth,rate-limit"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"
      - "traefik.http.middlewares.rate-limit.ratelimit.average=100"
      - "traefik.http.middlewares.rate-limit.ratelimit.burst=50"
      - "traefik.http.middlewares.rate-limit.ratelimit.period=1m"
      - "traefik.http.middlewares.secure-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.secure-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.secure-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.secure-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.secure-headers.headers.frameDeny=true"

  qdrant:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hashcode-public"
      - "traefik.http.routers.qdrant.rule=Host(`qdrant.${INFRA_DOMAIN}`)"
      - "traefik.http.routers.qdrant.entrypoints=websecure"
      - "traefik.http.routers.qdrant.tls.certresolver=letsencrypt"
      - "traefik.http.routers.qdrant.middlewares=rate-limit,secure-headers"
      - "traefik.http.services.qdrant.loadbalancer.server.port=6333"

  portainer:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hashcode-public"
      - "traefik.http.routers.portainer.rule=Host(`portainer.${INFRA_DOMAIN}`)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.routers.portainer.tls.certresolver=letsencrypt"
      - "traefik.http.routers.portainer.middlewares=rate-limit,secure-headers"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"

  vault:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hashcode-public"
      - "traefik.http.routers.vault.rule=Host(`vault.${INFRA_DOMAIN}`)"
      - "traefik.http.routers.vault.entrypoints=websecure"
      - "traefik.http.routers.vault.tls.certresolver=letsencrypt"
      - "traefik.http.routers.vault.middlewares=rate-limit,secure-headers"
      - "traefik.http.services.vault.loadbalancer.server.port=8200"
